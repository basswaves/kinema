name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **The two logs are the most useful thing you can attach.** Kinema
        forwards its own console to a file, because the window's own console is
        otherwise invisible from outside the app — most bugs here produce no
        visible error at all, only a log line.

        Open them from **Settings → Advanced → Developer tools → Open log folder**, or go
        to `%APPDATA%\com.kinema.app\logs\` (Windows) or
        `~/.local/share/com.kinema.app/logs/` (Linux):

        - `app.log` — the app's own messages, including what it found about
          your screen, receiver and graphics card at start
        - `mpv.log` — the player's, and the authority on anything about video

        On Linux there are more desktops, versions and drivers than one person
        can test, so Kinema aims for a base that works everywhere and falls
        back safely where something is missing. A setup where it still
        misbehaves is exactly what this form is for.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Paste the relevant part of `app.log`, and `mpv.log` too if this is about
        playback. If you are not sure what is relevant, attach both files.
      render: text

  - type: input
    id: version
    attributes:
      label: Kinema version
      description: From the release you downloaded, or the commit if built from source.
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System and version
      description: >
        Windows: run `winver`, e.g. "Windows 11 Pro 24H2 (26100.2314)". Linux:
        the distribution and version, e.g. "Fedora 43", "Ubuntu 26.04", "Arch".
    validations:
      required: true

  - type: dropdown
    id: desktop
    attributes:
      label: Desktop (Linux only)
      description: Screen switching and HDR go through the desktop, and each is asked its own way.
      options:
        - Not Linux
        - GNOME
        - KDE Plasma
        - Sway
        - Hyprland
        - Another (say which under "What happened")
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      description: >
        Windows: Task Manager → Performance → GPU, or `dxdiag`. Linux: the
        "Driver info" line in `mpv.log` gives it (NVIDIA's version, or Mesa's).
        Playback behaviour differs between AMD, Intel and NVIDIA, and driver
        version matters more than you would think — on Linux, HDR needs NVIDIA
        595 or Mesa 25.1 or later.
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Where is the media
      description: >
        Scanning, seeking and buffering all behave differently over a network
        share, and a share that has gone away looks exactly like a library that
        shrank.
      options:
        - Local disk
        - Network share (SMB / NAS)
        - Both
        - External / USB drive
    validations:
      required: true

  - type: textarea
    id: file
    attributes:
      label: The file, if this is about playback
      description: >
        Container, video codec, resolution, HDR or SDR, and audio codec —
        `mpv.log` has all of it, or MediaInfo if you have it. "4K HDR remux,
        HEVC 10-bit, TrueHD Atmos" is plenty.

  - type: dropdown
    id: input
    attributes:
      label: What were you using to navigate
      description: >
        A control that a mouse can reach and a remote cannot is a whole class of
        bug here, and it hides completely if you touch the mouse once.
      options:
        - Mouse and keyboard
        - Keyboard only
        - Remote / D-pad / gamepad
    validations:
      required: true
