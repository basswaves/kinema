# `npm run check` is `tsc + eslint` and never runs the bundler. A tree that
# type-checks and lints cleanly while `vite build` is broken is a real state
# this project has been in for months, which is the whole reason the build step
# below is separate rather than folded into `check`.
name: CI

# Docs, the website and the changelog cannot break the app; a push that only
# touches them (pages.yml publishes the site) skips the 15-minute run.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/winget.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/winget.yml'
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Every platform on every push, so a change made and checked on one cannot
    # quietly break another. Linux does not ship yet; these jobs prove it still
    # compiles and passes the same tests, on both x86 and ARM, while the port
    # is built (see CONTRIBUTING, "Checking Linux from Windows"). One failing
    # platform does not cancel the others: which ones fail is the information.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # What Tauri needs to compile on Linux: WebKitGTK and its friends. The
      # same list CONTRIBUTING gives, minus libmpv (loaded at runtime, as on
      # Windows).
      # The packages are kept between runs: Ubuntu's mirror for the runners
      # has stalled for minutes per file on some days (a 36 s step took 29
      # min), and a stalled download gives up after 15 s and retries.
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-cache/partial
          APT="-o Acquire::http::Timeout=15 -o Acquire::Retries=5 -o Dir::Cache::Archives=$HOME/apt-cache"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
          sudo chown -R "$USER" ~/apt-cache

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # `check` is tsc + eslint + vitest. Kept as one step because that is the
      # command contributors are told to run, and CI should fail on exactly
      # what their machine fails on.
      - name: Type-check, lint and test
        run: npm run check

      # Must run before cargo: tauri-build reads tauri.conf.json and expects
      # `frontendDist` (../dist) to exist. It also catches bundler-only breakage
      # that `check` cannot see.
      - name: Build the frontend
        run: npm run build

      # No libmpv needed. It is loaded dynamically at runtime rather than
      # linked, so the 95 MB download is not a test dependency.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Warnings fail the build. Clippy's warnings here have been the cheap
      # kind — a sort that could be simpler, an item after the tests — and
      # the only way they stay cheap is by never being allowed to pile up.
      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  ui:
    # The interface by keyboard, against dev:mock, in WebKit — the engine
    # Linux's window uses. Once, on x86 Linux: the engines are what differ,
    # not the processors. Its own job beside the builds (it needs no Rust),
    # with several workers: in the build job, one at a time, it was the
    # longest step (~9 min). Playwright's WebKit is fetched here, never shipped.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install WebKit
        run: |
          if [ '${{ steps.pw-cache.outputs.cache-hit }}' = 'true' ]; then
            npx playwright install-deps webkit
          else
            npx playwright install --with-deps webkit
          fi

      - name: Keyboard tests in WebKit
        run: npm run test:ui

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  android:
    # The Android app, built the way a TV box or a phone installs it, so a
    # change made on Windows or Linux cannot quietly break it. Built for ARM
    # (the boxes and phones) and x86-64 (the emulator in
    # scripts/android-bench.sh). The emulator itself is not run here yet.
    runs-on: ubuntu-24.04

    env:
      # Pinned with the bench (scripts/android-bench.sh), so CI builds with the
      # NDK the bench was checked with. The runner has the SDK already.
      NDK_VERSION: 28.2.13676358

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install the Android NDK
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # A debug build: it needs no signing key, and installs on any device
      # with debugging on. 32-bit ARM too: many TV boxes run a 32-bit Android
      # even on a 64-bit chip, and install nothing else.
      # Kinema's own code optimised too and without the debugger's line
      # tables, as scripts/android-bench.sh builds it: unoptimised, a 4K film
      # from a NAS stopped every few seconds, and the line tables made an APK
      # too big for an old box's free space.
      - name: Build the app
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: 2
          CARGO_PROFILE_DEV_STRIP: debuginfo
        run: npx tauri android build --debug --target aarch64 --target armv7 --target x86_64 --apk

      # The code only Android compiles (engine.rs and the other `mobile`
      # branches), held to the same rule as everywhere else. After the build,
      # which generates the files tauri-build reads for Android.
      - name: Rust lints for Android
        run: |
          bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          cargo clippy --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android --all-targets -- -D warnings

      - uses: actions/upload-artifact@v7
        with:
          name: kinema-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          retention-days: 14
