# The checks too slow for every push, once a night: the full navigation map
# (`npm run test:nav`) in the engines Kinema's windows really use — Edge on
# Windows (the engine of WebView2, and Chromium like Android's WebView) and
# WebKit on Linux (WebKitGTK's engine). Not Playwright's WebKit on Windows:
# it is neither, and it disagrees with both on one tie (GOTCHAS, "Playwright's
# WebKit on Windows"). A release session reads last night's result instead of
# running it again. A difference from e2e/navmap.expected.json fails the run;
# the generated map is kept as an artifact to read. Two workers: with five on
# a four-core runner, scrolling settings pages had not settled when measured.
name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  navmap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            engine: edge
          - os: ubuntu-24.04
            engine: webkit
    name: navmap (${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit
        if: matrix.engine == 'webkit'
        run: npx playwright install --with-deps webkit

      - name: Navigation map
        run: npx playwright test -c playwright.nav.config.ts --project ${{ matrix.engine }} --workers=2

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: navmap-${{ matrix.engine }}
          path: navmap-results/
          retention-days: 14
