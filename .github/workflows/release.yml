# Builds the portable ZIP attached to a GitHub release.
#
# Deliberately not an installer. `scripts/build-app.ps1` copies both native DLLs
# *beside* the exe, because `libmpv-2.dll` is resolved by Windows' own search
# order, which begins at the executable's directory and never looks in the
# directory the wrapper was loaded from. The Tauri bundler puts them in `lib/`,
# which loads the wrapper and then fails to find mpv — so the bundler is turned
# off in tauri.conf.json and this is the only supported way to produce the app.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # ~95 MB of LGPL native libraries, never committed. See NOTICE.md.
      - name: Fetch the native playback libraries
        run: npx tauri-plugin-libmpv-api setup-lib

      # Explicit switch as well as the CI guard inside the script: a runner has
      # no desktop, and a COM call for a shortcut nobody will ever click is a
      # failure point in exchange for nothing.
      # Kinema's own TMDB key (src/metadata/builtinKey.ts), from a repository
      # secret so it is never in the source. A release without it would still
      # run, as a build from source does, but would leave movies unidentified
      # for everyone who has no key of their own — so a missing secret stops
      # the release instead.
      - name: Check the TMDB key is set
        shell: pwsh
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: if (-not $env:VITE_TMDB_API_KEY) { throw 'The TMDB_API_KEY repository secret is not set.' }

      # Kinema's SIMKL app ID (src-tauri/src/simkl.rs), compiled in. Not a
      # secret to SIMKL, but kept out of the source so the repository does not
      # say whose account registered it. Unlike the TMDB key it is optional: a
      # release without it simply has no SIMKL, as a build from source does.
      - name: Build the portable app
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          KINEMA_SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          # Kinema's Trakt app (trakt.rs). Trakt's device sign-in needs the
          # secret as well as the ID; like the TMDB key, it is readable by
          # anyone holding the app. Optional, as SIMKL's is.
          KINEMA_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          KINEMA_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          # Kinema's OpenSubtitles app key (opensubtitles.rs). Optional too.
          KINEMA_OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-app.ps1 -NoShortcut

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $zip = "kinema-$version-windows-x64.zip"
          Compress-Archive -Path dist-app\* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "ZIP=$zip"       | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "SHA256=$hash"   | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          body: |
            ## Install

            Download the ZIP, extract it anywhere, and run `kinema.exe`.
            No installer, nothing written outside the folder and your app data.

            **Windows 11 only.** Needs the WebView2 runtime, which ships with
            Windows 11 — nothing to install separately.

            ### Windows will ask once whether to run it

            Kinema is not code-signed, so the first time you open it Windows
            shows *"Windows protected your PC"*. Click **More info**, then
            **Run anyway**; Windows remembers. To check you got the file this
            workflow built, run this in PowerShell where you downloaded it:

            ```powershell
            Get-FileHash .\${{ env.ZIP }} -Algorithm SHA256
            ```

            Expected: `${{ env.SHA256 }}`

            ### First run

            Kinema opens on a setup panel: add your movies and TV folders, and
            scan. Posters and descriptions come from TMDB through a key Kinema
            carries, so there is nothing to sign up for; a free key of your own
            can be entered in Settings instead.

            ---

            Bundles an unmodified LGPL build of libmpv, which you may replace —
            see [NOTICE.md](NOTICE.md).
