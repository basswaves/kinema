# Builds everything attached to a GitHub release: the portable Windows ZIP,
# and for Linux a .deb, an .rpm and a .tar.gz folder, for x86-64 and ARM.
#
# Each platform builds in its own job and hands its files on; one job at the
# end puts them all on a single draft release. (Several jobs each creating the
# draft is how releases end up duplicated.) Started by hand, it builds
# everything and publishes nothing — the files are left as the run's
# artifacts, to check a change to this workflow without a release.
#
# File names carry no version (kinema-windows-x64-setup.exe, not
# kinema-0.13.0-windows-x64-setup.exe), so the website can link straight to
# releases/latest/download/<name>; the version is in the release's tag.
#
# Windows: the portable ZIP and a per-user installer, built from the same exe.
# Both have the two native DLLs *beside* the exe, because `libmpv-2.dll` is
# resolved by Windows' own search order, which begins at the executable's
# directory and never looks in the directory the wrapper was loaded from.
# `scripts/build-app.ps1` copies them for the ZIP; the installer maps them
# there (tauri.installer.conf.json), and its uninstaller takes everything away
# again (src-tauri/windows/hooks.nsh). The bundler is off in tauri.conf.json,
# so an ordinary build makes no installer. The winget manifest for the
# installer is written and validated here, and submitted only by winget.yml.
#
# Linux: the system's own mpv, declared as a dependency of the packages, so
# there are no media libraries here to keep patched. See
# scripts/package-linux.sh.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # ~95 MB of LGPL native libraries, never committed. See NOTICE.md.
      - name: Fetch the native playback libraries
        run: npx tauri-plugin-libmpv-api setup-lib

      # The plugin's wrapper DLL needs VCRUNTIME140.dll, which a fresh Windows
      # may lack; this one, from the same pinned source as Linux's, has the
      # runtime built in. Replaces the fetched one.
      - name: Build the mpv wrapper
        shell: bash
        run: bash scripts/build-mpv-wrapper.sh

      # Kinema's own TMDB key (src/metadata/builtinKey.ts), from a repository
      # secret so it is never in the source. A release without it would still
      # run, as a build from source does, but would leave movies unidentified
      # for everyone who has no key of their own — so a missing secret stops
      # the release instead.
      - name: Check the TMDB key is set
        shell: pwsh
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: if (-not $env:VITE_TMDB_API_KEY) { throw 'The TMDB_API_KEY repository secret is not set.' }

      # Explicit -NoShortcut as well as the CI guard inside the script: a
      # runner has no desktop, and a COM call for a shortcut nobody will ever
      # click is a failure point in exchange for nothing.
      - name: Build the portable app and the installer
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Kinema's SIMKL app ID (src-tauri/src/simkl.rs), compiled in. Not a
          # secret to SIMKL, but kept out of the source so the repository does
          # not say whose account registered it. Optional: a release without
          # it simply has no SIMKL, as a build from source does.
          KINEMA_SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          # Kinema's Trakt app (trakt.rs). Trakt's device sign-in needs the
          # secret as well as the ID; like the TMDB key, it is readable by
          # anyone holding the app. Optional, as SIMKL's is.
          KINEMA_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          KINEMA_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          # Kinema's OpenSubtitles app key (opensubtitles.rs). Optional too.
          KINEMA_OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-app.ps1 -NoShortcut -Installer

      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $zip = "kinema-windows-x64.zip"
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist-app\* -DestinationPath "out\$zip"
          $hash = (Get-FileHash "out\$zip" -Algorithm SHA256).Hash.ToLower()
          # LF, as sha256sum writes it: a CRLF line makes `sha256sum -c` on
          # Linux look for a file whose name ends in a carriage return.
          [IO.File]::WriteAllText("$PWD\out\$zip.sha256", "$hash  $zip`n")
          $setup = "kinema-windows-x64-setup.exe"
          $built = @(Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe)
          if ($built.Count -ne 1) { throw "Expected one installer, found: $($built.Name -join ', ')" }
          Copy-Item $built[0].FullName "out\$setup"
          $setupHash = (Get-FileHash "out\$setup" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\out\$setup.sha256", "$setupHash  $setup`n")
          "VERSION=$version" >> $env:GITHUB_ENV
          "SETUP_SHA=$setupHash" >> $env:GITHUB_ENV

      # Not attached to the release: winget.yml submits it, once the release
      # is published and the owner says so. Written for every build so a
      # mistake in it shows here, not on submission day.
      - name: Write and validate the winget manifest
        shell: pwsh
        run: |
          ./scripts/winget-manifest.ps1 -Version $env:VERSION -Sha256 $env:SETUP_SHA -OutDir winget
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw 'winget is not on this runner.' }
          winget validate --manifest winget
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed ($LASTEXITCODE)." }

      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifest
          path: winget/*

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*

  linux:
    # On the oldest Ubuntu the .deb should install on: a program built
    # against a newer C library refuses to start on an older one.
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Kept between runs and with short timeouts, as in ci.yml (the
      # runners' Ubuntu mirror has stalled for minutes per file).
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-release-${{ runner.arch }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: apt-release-${{ runner.arch }}-

      - name: Install Linux build libraries
        run: |
          mkdir -p ~/apt-cache/partial
          APT="-o Acquire::http::Timeout=15 -o Acquire::Retries=5 -o Dir::Cache::Archives=$HOME/apt-cache"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
          sudo chown -R "$USER" ~/apt-cache

      - name: Install dependencies
        run: npm ci

      - name: Check the TMDB key is set
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: test -n "$VITE_TMDB_API_KEY" || { echo 'The TMDB_API_KEY repository secret is not set.'; exit 1; }

      # The same built-in keys as the Windows build; see there.
      - name: Build and package
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          KINEMA_SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          KINEMA_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          KINEMA_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          KINEMA_OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: bash scripts/package-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.os }}
          path: dist-linux/*

  fedora:
    # The .rpm on a stock Fedora, as a user installs it: dnf has to find mpv
    # and, through the weak dependency "(ffmpeg or ffmpeg-free)", Fedora's own
    # ffmpeg-free, so the detail page's badges work without a second step.
    # Not a step of `publish`: it says whether the release text's promise
    # holds, and a Fedora mirror having a bad minute should not hold a
    # release back.
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:43

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-ubuntu-24.04

      # Fedora's container image turns weak dependencies off to stay small;
      # an installed Fedora has them on, which is what this is checking.
      - name: Install the .rpm with dnf
        run: dnf install -y --setopt=install_weak_deps=True ./kinema-linux-x86_64.rpm

      - name: Check mpv and ffmpeg came with it
        run: |
          rpm -q "$(rpm -qp --qf '%{NAME}' ./kinema-linux-x86_64.rpm)"
          rpm -q mpv-libs
          rpm -q ffmpeg-free || rpm -q ffmpeg
          ffprobe -version | head -n 1
          ffmpeg -hide_banner -decoders | grep -E ' (aac|ac3|eac3|truehd|dts) ' || true

  android:
    # The signed release APK, for sideloading on a TV box or a phone. Built
    # for 64-bit and 32-bit ARM (the boxes and phones; many TV boxes run a
    # 32-bit Android even on a 64-bit chip). The x86-64 build in ci.yml is for
    # the emulator and is not shipped. Signed with Kinema's own key, kept as
    # repository secrets (ANDROID_KEYSTORE_BASE64 is the .p12 file in base64);
    # the same key must sign every release or phones refuse to update.
    runs-on: ubuntu-24.04

    env:
      # Pinned with ci.yml and scripts/android-bench.sh.
      NDK_VERSION: 28.2.13676358

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install the Android NDK
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Every key the desktop jobs get, and the signing key. The desktop jobs
      # let all but TMDB's be missing; the Android release does not, so a
      # forgotten secret stops it instead of shipping an app without Trakt.
      - name: Check every key is set
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=0
          for name in TMDB_API_KEY SIMKL_CLIENT_ID TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET OPENSUBTITLES_API_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then echo "The $name repository secret is not set."; missing=1; fi
          done
          exit $missing

      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kinema-release.p12"
          echo "KINEMA_KEYSTORE_FILE=$RUNNER_TEMP/kinema-release.p12" >> "$GITHUB_ENV"

      # The version code comes from the version (0.10.0 -> 10000), so it
      # rises with every release.
      - name: Build the signed app
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          KINEMA_SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          KINEMA_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          KINEMA_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          KINEMA_OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          KINEMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KINEMA_KEY_ALIAS: kinema
        run: npx tauri android build --target aarch64 --target armv7 --apk

      # Looks at the finished APK: signed with our key, and each built-in key
      # really compiled in (the TMDB key in the page bundle, the others in the
      # native library). Only names are printed, never values.
      - name: Check the APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: |
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)
          echo "APK: $apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | grep -E "certificate (DN|SHA-256)" | head -2
          "$apksigner" verify "$apk"
          fail=0
          # Tauri compresses the page into the native library, so the TMDB key
          # is read from the page bundle as it was handed to the build.
          grep -rlaF -- "$TMDB_API_KEY" dist/assets > /dev/null && echo "TMDB_API_KEY: in the page bundle that was embedded" || { echo "TMDB_API_KEY: NOT in the page bundle"; fail=1; }
          for name in SIMKL_CLIENT_ID TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET OPENSUBTITLES_API_KEY; do
            for abi in arm64-v8a armeabi-v7a; do
              unzip -p "$apk" "lib/$abi/*.so" | grep -aqF -- "${!name}" && echo "$name: in lib/$abi" || { echo "$name: NOT in lib/$abi"; fail=1; }
            done
          done
          exit $fail

      - name: Package
        run: |
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk "out/kinema-android.apk"
          cd out && sha256sum kinema-android.apk > kinema-android.apk.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*

  publish:
    # Only for a pushed tag; a run started by hand stops at the artifacts.
    if: github.event_name == 'push'
    needs: [windows, linux, android]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      # The winget manifest is for winget.yml, not a file for users.
      - name: Leave the winget manifest out
        run: rm -f files/Basswaves.Kinema*.yaml

      - name: Read the checksums for the notes
        run: |
          cd files
          version="${GITHUB_REF_NAME#v}"
          {
            echo "VERSION=$version"
            echo "WIN_SHA=$(cut -d' ' -f1 kinema-windows-x64.zip.sha256)"
            echo "SETUP_SHA=$(cut -d' ' -f1 kinema-windows-x64-setup.exe.sha256)"
          } >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: files/*
          body: |
            ## Windows

            **Installer:** download `kinema-windows-x64-setup.exe`
            and run it. It installs for your Windows account only (no
            administrator) and adds Kinema to the Start menu. Uninstall it
            from Settings → Apps: it removes the program, its shortcuts and its
            "Open with" entries, and asks before deleting your library and
            settings.

            **Portable:** or download `kinema-windows-x64.zip`,
            extract it anywhere, and run `kinema.exe`. Nothing is written
            outside the folder and your app data.

            **Windows 11.** Needs the WebView2 runtime, which ships with
            Windows 11; on a PC without it the installer fetches it from
            Microsoft, and the ZIP needs it installed first.

            #### Windows will ask once whether to run it

            Kinema is not code-signed, so the first time you open it Windows
            shows *"Windows protected your PC"*. Click **More info**, then
            **Run anyway**; Windows remembers. To check that the file you
            downloaded is the one that was published, run this in PowerShell
            in the folder you downloaded it to:

            ```powershell
            Get-FileHash .\kinema-windows-x64-setup.exe -Algorithm SHA256
            Get-FileHash .\kinema-windows-x64.zip -Algorithm SHA256
            ```

            Expected: `${{ env.SETUP_SHA }}` for the installer,
            `${{ env.WIN_SHA }}` for the ZIP.
            The two must match exactly. Each file also has a `.sha256` beside it.

            ## Linux

            Kinema uses your system's mpv and WebKitGTK; the packages install
            them for you. For x86-64 PCs take the `amd64` / `x86_64` files,
            for ARM the `arm64` / `aarch64` ones.

            **Ubuntu 24.04 or later, Debian 13:**

            ```bash
            sudo apt install ./kinema-linux-amd64.deb
            ```

            **Fedora:**

            ```bash
            sudo dnf install ./kinema-linux-x86_64.rpm
            ```

            **Anything else:** unpack `kinema-linux-x86_64.tar.gz`
            and run `./kinema`; its README.txt names the two libraries (mpv
            and WebKitGTK) to install. HDR on Wayland needs mpv 0.40 or later — Ubuntu 26.04,
            Debian 13, Fedora 43 and Arch have it.

            To check a download, put the file and its `.sha256` in one folder
            and run `sha256sum -c <file>.sha256` there.

            ## Android (early version)

            For Android TV boxes, installed by hand (sideloaded): download
            `kinema-android.apk`, copy it to the device and
            open it (Android asks once to allow installs from that source).
            It is an early version, tried on one TV box and the emulator; a
            phone has not been tried. See the README for what has been tested
            and what is still missing. Check the download with
            `sha256sum -c kinema-android.apk.sha256`; the
            certificate it is signed with is named in the README.

            ## First run

            Kinema asks where it will be watched and where your movies and TV
            folders are, then scans — with a few skippable setup pages while it
            does. Posters and descriptions come from TMDB through a key Kinema
            carries, so there is nothing to sign up for; a free key of your own
            can be entered in Settings instead.

            ---

            The Windows ZIP bundles an unmodified LGPL build of libmpv, which
            you may replace; on Linux the system's libmpv is used; Android uses
            Google's Media3 (Apache-2.0) — see [NOTICE.md](NOTICE.md).

            Something not working, or it works on a device the README does not
            list? Say so: [bug report](https://github.com/Basswaves/kinema/issues/new?template=bug_report.yml)
            or [device report](https://github.com/Basswaves/kinema/issues/new?template=device_report.yml).
