[package]
name = "personal-netflix"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "personal_netflix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` compiles in the asset:// handler that serves cached artwork
# out of app data. Without it, `assetProtocol.enable` in tauri.conf.json is
# silently ignored and every cached image fails to load.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-libmpv = "0.3.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
walkdir = "2.5.0"
# NFO sidecars are XML. Event-based rather than deserialised into a struct:
# the shape varies between MediaElch, tinyMediaManager and Kodi itself, and a
# reader that ignores what it does not recognise survives all three.
quick-xml = "0.38"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"

