[package]
name = "kinema"
version = "0.9.2"
description = "A local, serverless media library for movies and TV shows"
authors = ["Basswaves"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Basswaves/kinema"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kinema_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` compiles in the asset:// handler that serves cached artwork
# out of app data. Without it, `assetProtocol.enable` in tauri.conf.json is
# silently ignored and every cached image fails to load.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
walkdir = "2.5.0"
# NFO sidecars are XML. Event-based rather than deserialised into a struct:
# the shape varies between MediaElch, tinyMediaManager and Kodi itself, and a
# reader that ignores what it does not recognise survives all three.
quick-xml = "0.38"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
# Pure Rust, MIT, no C library. The audio fingerprinting behind intro/credits
# detection — and the reason a detector can live in this app at all rather than
# being another installed tool. Decoding still needs ffmpeg (see ffmpeg.rs):
# Symphonia cannot read AC-3, E-AC-3, DTS or TrueHD, which is most of a remux.
rusty-chromaprint = "0.3.0"
# Decompresses IMDb's ratings file (imdb.rs). Already compiled in through the
# PNG decoder Tauri uses, so naming it adds no new code to the build.
flate2 = "1"
# The QR code on the SIMKL sign-in screen (simkl.rs), so a phone can scan it
# from the sofa. Pure Rust, no image library: it writes SVG text.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Already compiled in through Tauri's runtime; named for its timer, so the
# SIMKL sender can wait between writes without holding a thread.
tokio = { version = "1", features = ["time", "sync"] }
# Already compiled in through Tauri and the libmpv plugin; named so their
# warnings and errors can be sent to app.log (applog.rs, `Forward`).
log = "0.4"
# Network shares (netshare.rs), where the system does not open them for Kinema
# — Android. Pure Rust, MIT, no C library; SMB 2 and 3 with signing and
# encryption. The blocking flavour, as the scanner and the file reading
# around it are blocking. Its TCP part is a patched copy (vendor/README.md).
smb = { version = "0.12.1", default-features = false, features = ["sign", "encrypt", "multi_threaded"] }

# Computers only (Windows, Linux). On Android the player is Media3 and the
# system keeps one Kinema by itself; neither plugin has a mobile side.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# The player engine (engine.rs).
tauri-plugin-libmpv = "0.3.2"
# Tauri's own plugin, so that starting Kinema twice brings the first window
# forward instead of opening a second one (see `run` in lib.rs).
tauri-plugin-single-instance = "2"

# Microsoft's own bindings, already compiled in through Tauri at this version.
# Used read-only by equipment.rs to ask Windows what the screens and audio
# outputs can take — display modes, HDR, bitstream formats.
# Win32_System_Power is power.rs putting the PC to sleep, only when asked.
# ToolHelp, ProcessStatus and Threading are procstats.rs reading this process's
# own memory, threads and handles for the self-test's leak runs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Devices_Properties",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

# Linux only: the page photographed for mpv to draw (overlay/linux.rs). The
# same versions Tauri's own webview already compiles in, so nothing new is
# built; named so their types can be used here.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
# The equipment check (equipment/linux.rs): GNOME's screens over D-Bus — the
# zbus two Tauri plugins already compile in — and what each HDMI receiver
# announced, read from ALSA's own controls. alsa links libasound, which
# libmpv already needs on every Linux system.
zbus = "5"
alsa = "0.12"
# Sway, Hyprland and the other wlroots desktops' screens (wlroots.rs): the
# wlr-output-management protocol spoken directly. Pure Rust (Smithay's
# crates, no libwayland to link); nothing to install alongside.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# A crates.io dependency replaced by a patched copy; vendor/README.md says
# what changed and when it can go.
[patch.crates-io]
smb-transport = { path = "vendor/smb-transport" }

# Every crate Kinema uses is built as a release build is, even in a debug
# build of Kinema itself: unoptimised, the SMB client's signing, SQLite and
# the parsers ran several times slower, and a test build is only worth
# measuring if it plays as a release does. Kinema's own code keeps its
# checks. Overflow checks off matters on its own too: kbkdf (under smb: the
# keys of an encrypted SMB session) works out 2 to the power of 32 in a
# usize, which overflows on 32-bit ARM — many TV boxes — and a debug
# build's check stopped every NAS sign-in on such a box ("attempt to
# exponentiate with overflow"); release builds wrap it, harmlessly.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# A release is optimised across crates (thin LTO) and as one unit, for speed
# on weak boxes and a smaller library. Panics still unwind: jobs.rs catches
# one so a failing job cannot take the app down.
[profile.release]
lto = "thin"
codegen-units = 1
