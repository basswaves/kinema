[package]
name = "kinema"
version = "0.2.0"
description = "A local, serverless media library for movies and TV shows"
authors = ["Basswaves"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Basswaves/kinema"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kinema_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` compiles in the asset:// handler that serves cached artwork
# out of app data. Without it, `assetProtocol.enable` in tauri.conf.json is
# silently ignored and every cached image fails to load.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-libmpv = "0.3.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
walkdir = "2.5.0"
# NFO sidecars are XML. Event-based rather than deserialised into a struct:
# the shape varies between MediaElch, tinyMediaManager and Kodi itself, and a
# reader that ignores what it does not recognise survives all three.
quick-xml = "0.38"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
# Pure Rust, MIT, no C library. The audio fingerprinting behind intro/credits
# detection — and the reason a detector can live in this app at all rather than
# being another installed tool. Decoding still needs ffmpeg (see ffmpeg.rs):
# Symphonia cannot read AC-3, E-AC-3, DTS or TrueHD, which is most of a remux.
rusty-chromaprint = "0.3.0"

# Microsoft's own bindings, already compiled in through Tauri at this version.
# Used read-only by equipment.rs to ask Windows what the screens and audio
# outputs can take — display modes, HDR, bitstream formats.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Devices_Properties",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

